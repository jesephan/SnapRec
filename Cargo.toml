[package]
name = "snaprec"
version = "0.1.0"
edition = "2021"
description = "Simple macOS screenshot annotator and screen recorder"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
arboard = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tray-icon = "0.19"
global-hotkey = "0.6"
winit = "0.30"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
